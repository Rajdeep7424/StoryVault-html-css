<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Read [Story Title], a captivating [Genre] story on StoryVault.">
    <meta name="keywords" content="[Story Title], [Genre], short story, online stories">
    <title>[Story Title] | StoryVault</title>
    <link rel="stylesheet" href="styles.css"> <!-- Link to your stylesheet -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"> <!-- Link to your stylesheet -->
    <style>
        body {
            font-family: Georgia, 'Times New Roman', Times, serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
        }
        header {
            background-color: #4CAF50;
            color: white;
            padding: 15px;
            text-align: center;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
            border-radius: 8px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .story-content {
            margin-top: 20px;
            font-size: 18px;
            line-height: 1.8;
            text-align: justify;
        }
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px 0;
            margin-top: 30px;
        }
        .back-link {
            display: block;
            margin-top: 20px;
            text-align: center;
            text-decoration: none;
            color: #4CAF50;
            font-weight: bold;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div id="navbar"></div>

<header>
    <h1>[Story Title]</h1>
</header>

<div class="container">
    <h1>[Story Title]</h1>
    <p class="story-meta">By [Author Name] | [Genre]</p>
    
    <div class="story-content">
        <!-- Insert your story content here -->
        <p class="py-3"></p>
        <p class="py-3"></p>
        <p class="py-3"></p>
        <p class="py-3"></p>
        <p class="py-3"></p>
        <p class="py-3"></p>
        <p class="py-3"></p>
        <p class="py-3"></p>
        <!-- Continue the story content -->
    </div>

    <a href="..\[Genre].html" class="back-link">← Back to [Genre] Stories</a>
</div>

<div id="footer"></div>
    <!-- Scripts -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
    <script src="../../components/js.js"></script>
</body>
</html>
